  "BDEFGHIK":["E","G","B","D","H","F","I","K"],
  "BDEFGHIJ":["H","G","B","D","J","F","E","I"],
};

// ══════════════════════════════════════════════
// HORÁRIO — trava 24h antes do jogo
// ══════════════════════════════════════════════
function jogoTravado(jogo) {
  if (!jogo.dt) return false;
  // Pega data e hora separados e monta usando horário local do browser
  const partes = jogo.dt.split('T');
  const [ano, mes, dia] = partes[0].split('-').map(Number);
  const [hora, min] = partes[1].split(':').map(Number);
  // Cria data no horário LOCAL do dispositivo (sem conversão UTC)
  const inicio = new Date(ano, mes-1, dia, hora, min, 0);
  const prazo = new Date(inicio.getTime() - 60*60*1000); // 1h antes
  return new Date() >= prazo;
}

// ══════════════════════════════════════════════
// CLASSIFICAÇÃO — critérios FIFA 2026
// ══════════════════════════════════════════════
function calcStats(grupo, res) {
  const st = {};
  GR[grupo].forEach(t => st[t]={t,pts:0,j:0,v:0,e:0,d:0,gf:0,gc:0,sg:0});
  JOGOS.filter(j=>j.g===grupo).forEach(j=>{
    const r=res[j.id]; if(!r||r.c==null||r.f==null)return;
    const ca=st[j.c],fo=st[j.f];
    ca.j++;fo.j++;ca.gf+=r.c;ca.gc+=r.f;fo.gf+=r.f;fo.gc+=r.c;
    ca.sg=ca.gf-ca.gc;fo.sg=fo.gf-fo.gc;
    if(r.c>r.f){ca.pts+=3;ca.v++;fo.d++;}
    else if(r.c<r.f){fo.pts+=3;fo.v++;ca.d++;}
    else{ca.pts++;fo.pts++;ca.e++;fo.e++;}
  });
  return st;
}

function h2h(times, grupo, res) {
  const h={};
  times.forEach(t=>h[t]={pts:0,sg:0,gf:0});
  JOGOS.filter(j=>j.g===grupo&&times.includes(j.c)&&times.includes(j.f)).forEach(j=>{
    const r=res[j.id]; if(!r||r.c==null||r.f==null)return;
    h[j.c].gf+=r.c;h[j.c].sg+=r.c-r.f;
    h[j.f].gf+=r.f;h[j.f].sg+=r.f-r.c;
    if(r.c>r.f)h[j.c].pts+=3;
    else if(r.c<r.f)h[j.f].pts+=3;
    else{h[j.c].pts++;h[j.f].pts++;}
  });
  return h;
}

function classif(grupo, res) {
  const st = calcStats(grupo, res);
  const arr = Object.values(st);
  arr.sort((a,b)=>{
    if(b.pts!==a.pts)return b.pts-a.pts;
    const empPts = arr.filter(x=>x.pts===a.pts);
    if(empPts.length>1){
      const hh = h2h(empPts.map(x=>x.t), grupo, res);
      const ha=hh[a.t],hb=hh[b.t];
      if(hb.pts!==ha.pts)return hb.pts-ha.pts;
      if(hb.sg!==ha.sg)return hb.sg-ha.sg;
      if(hb.gf!==ha.gf)return hb.gf-ha.gf;
    }
    if(b.sg!==a.sg)return b.sg-a.sg;
    if(b.gf!==a.gf)return b.gf-a.gf;
    return 0;
  });
  return arr;
}

function top8Terceiros(res) {
  const t3=[];
  Object.keys(GR).forEach(g=>{
    const cl=classif(g,res);
    if(cl[2]&&cl[2].j>0) t3.push({...cl[2],grupo:g});
  });
  return t3.sort((a,b)=>{
    if(b.pts!==a.pts)return b.pts-a.pts;
    if(b.sg!==a.sg)return b.sg-a.sg;
    if(b.gf!==a.gf)return b.gf-a.gf;
    return 0;
  });
}

// Resolve todos os slots dos 32-avos garantindo unicidade
// Só preenche terceiros quando houver exatamente 8 grupos classificados
function resolveSlots(res) {
  const t3all = top8Terceiros(res);
  const t3top = t3all.slice(0,8);
  const grupos8 = t3top.map(x=>x.grupo).sort();
  const timeDoGrupo = {};
  t3top.forEach(x=>timeDoGrupo[x.grupo]=x.t);

  // Mapa de alocação: R_id → grupo do terceiro
  let aloc = null;
  if(grupos8.length===8){
    const key = grupos8.join("");
    const row = M495[key];
    if(row){
      // row = [1A_vs, 1B_vs, 1D_vs, 1E_vs, 1G_vs, 1I_vs, 1K_vs, 1L_vs]
      aloc = {R7:row[0],R13:row[1],R9:row[2],R2:row[3],R10:row[4],R5:row[5],R15:row[6],R8:row[7]};
    }
  }

  const out={};
  CR32.forEach(cr=>{
    for(const slot of [cr.c,cr.f]){
      const key=`${cr.id}|${slot}`;
      if(!slot.startsWith("3")){
        const pos=parseInt(slot[0])-1;
        const g=slot[1];
        const cl=classif(g,res);
        out[key]=cl[pos]?.t||null;
      } else {
        // Só mostra terceiro se tiver alocação completa
        if(aloc&&aloc[cr.id]){
          out[key]=timeDoGrupo[aloc[cr.id]]||null;
        } else {
          out[key]=null; // "a definir"
        }
      }
    }
  });
  return out;
}

// Constrói res mesclado: palpite do usuário + resultados reais (real tem prioridade)
function resMesclado() {
  const rm={};
  JOGOS.forEach(j=>{
    if(resReais[j.id]!=null) rm[j.id]=resReais[j.id];
    else { const p=(pals.grupo||{})[j.id]; if(p&&p.c!=null&&p.f!=null) rm[j.id]={c:p.c,f:p.f}; }
  });
  return rm;
}

// ══════════════════════════════════════════════
// PONTUAÇÃO
// ══════════════════════════════════════════════
function calcPts(palGrupo,resR,palConf,confR,palElim,elimR){
  let pts=0;
  Object.entries(resR||{}).forEach(([id,r])=>{
    const p=(palGrupo||{})[id]; if(!p||p.c==null||p.f==null)return;
    if(p.c===r.c&&p.f===r.f){pts+=10;return;}
    const vR=r.c>r.f?1:r.f>r.c?-1:0,vP=p.c>p.f?1:p.f>p.c?-1:0;
    if(vR===vP)pts+=5;
  });
  Object.entries(elimR||{}).forEach(([id,r])=>{
    const p=(palElim||{})[id]; if(!p||p.c==null||p.f==null)return;
    if(p.c===r.c&&p.f===r.f){pts+=10;return;}
    const vR=r.c>r.f?1:r.f>r.c?-1:0,vP=p.c>p.f?1:p.f>p.c?-1:0;
    if(vR===vP)pts+=5;
  });
  Object.entries(confR||{}).forEach(([fase,arr])=>{
    (arr||[]).forEach((c,i)=>{
      if(!c?.casa||!c?.fora)return;
      const cp=((palConf||{})[fase]||[])[i];
      if(cp?.casa===c.casa&&cp?.fora===c.fora)pts+=2;
    });
  });
  return pts;
}

async function carregarRanking(lista){
  if(!lista)return;
  lista.innerHTML=`<div style="text-align:center;color:#3a6a3a;padding:20px">Carregando...</div>`;

  const todos=[];
  for(const p of participantes){
    const pal=await fbG("palpites",p.id)||{};
    const pts=calcPts(pal.grupo||{},resReais,pal.conf||{},confReais,pal.elim||{},elimResG);
    todos.push({...p,pts});
  }
  todos.sort((a,b)=>b.pts-a.pts);
  lista.innerHTML="";
  if(todos.length===0){lista.innerHTML=`<div style="color:#3a6a3a;text-align:center;padding:40px">Nenhum participante ainda.</div>`;return;}
  todos.forEach((p,i)=>{

    const el=document.createElement("div");
    el.style.cssText=`display:flex;align-items:center;gap:10px;background:${isEu?"linear-gradient(135deg,#0a1a0a,#061a06)":"#080d08"};border:2px solid ${i===0?"#FFD700":i===1?"#888":i===2?"#cd7f32":isEu?"#22c55e":"#1a3a1a"};border-radius:12px;padding:12px 14px;margin-bottom:8px`;
    el.innerHTML=`<span style="font-size:1.4rem;width:32px;text-align:center">${i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}º`}</span><div style="flex:1"><div style="font-weight:700">${p.nome} ${isEu?'<span style="color:#22c55e;font-size:.68rem">(você)</span>':''}</div><div style="font-size:.68rem;color:#3a6a3a">${p.email}</div></div><div style="font-weight:900;font-size:1.4rem;color:${i===0?"#FFD700":"#fff"}">${p.pts}<span style="font-size:.65rem;color:#3a6a3a;font-weight:400;margin-left:2px">pts</span></div>`;
    el.onclick=()=>verPalpites(p,lista);
    lista.appendChild(el);
  });
  const info=document.createElement("div");info.style.cssText="margin-top:14px;padding:10px 14px;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:10px;font-size:.72rem;color:#3a6a3a;line-height:1.9";
  info.innerHTML="🎯 Exato → <strong style='color:#FFD700'>10pts</strong> &nbsp;|&nbsp; ✅ Vencedor → <strong style='color:#FFD700'>5pts</strong> &nbsp;|&nbsp; 🗓️ Confronto → <strong style='color:#FFD700'>2pts</strong>";
  lista.appendChild(info);
}

async function verPalpites(p,lista){
  if(!isAdmin&&p.id!==usuario?.id)return;
  const palP=await fbG("palpites",p.id)||{};
  const editando = isAdmin; // admin pode editar palpites de qualquer pessoa
  let palEditavel = JSON.parse(JSON.stringify(palP)); // cópia editável

  function montar(){
    const pts=calcPts(palEditavel.grupo||{},resReais,palEditavel.conf||{},confReais,palEditavel.elim||{},elimResG);
    if(document.getElementById("ovPal")) document.getElementById("ovPal").remove();

    const ov=document.createElement("div");
    ov.id="ovPal";
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;overflow-y:auto;padding:20px";
    const box=document.createElement("div");box.style.cssText="max-width:600px;margin:0 auto;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:16px;padding:20px";

    box.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-weight:900;color:#22c55e;font-size:1rem">${p.nome}</div>
        <div style="font-size:.7rem;color:#3a6a3a">${p.email}</div>
        ${editando?'<div style="font-size:.65rem;background:#1a2a1a;color:#86efac;padding:2px 8px;border-radius:4px;margin-top:4px;display:inline-block">✏️ Modo edição Admin</div>':""}
      </div>
      <button onclick="document.getElementById('ovPal').remove()" style="background:#1a0a0a;color:#f87171;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700">✕</button>
    </div>`;

    const ptDiv=document.createElement("div");ptDiv.style.cssText="background:#061506;border:1px solid #22c55e;border-radius:10px;padding:12px;text-align:center;margin-bottom:14px";
    ptDiv.innerHTML=`<div style="font-size:.75rem;color:#3a6a3a">PONTUAÇÃO ATUAL</div><div style="font-size:2rem;font-weight:900;color:#22c55e">${pts}<span style="font-size:.8rem;color:#3a6a3a"> pts</span></div>`;
    box.appendChild(ptDiv);

    // Botão salvar (admin)
    if(editando){
      const btnSalvar=document.createElement("button");
      btnSalvar.style.cssText="width:100%;background:#22c55e;color:#000;border:none;border-radius:8px;padding:10px;font-weight:900;cursor:pointer;margin-bottom:14px;font-size:.9rem";
      btnSalvar.textContent="💾 Salvar alterações";
      btnSalvar.onclick=async()=>{
        await fbS("palpites",p.id,palEditavel);
        toast(`Palpites de ${p.nome} salvos! ✅`);
        document.getElementById("ovPal").remove();
      };
      box.appendChild(btnSalvar);
    }

    Object.keys(GR).forEach(g=>{
      const sec=document.createElement("div");sec.style.cssText="font-size:.72rem;font-weight:800;color:#86efac;margin:12px 0 6px;letter-spacing:1px";sec.textContent=`GRUPO ${g}`;box.appendChild(sec);
      JOGOS.filter(j=>j.g===g).forEach(j=>{
        const palJ=(palEditavel.grupo||{})[j.id];const resJ=resReais[j.id];
        let badge="";
        if(resJ&&palJ&&palJ.c!=null){
          if(palJ.c===resJ.c&&palJ.f===resJ.f)badge='<span style="background:#22c55e;color:#000;font-size:.6rem;padding:1px 5px;border-radius:10px;font-weight:700">+10</span>';
          else{const vR=resJ.c>resJ.f?1:resJ.f>resJ.c?-1:0,vP=palJ.c>palJ.f?1:palJ.f>palJ.c?-1:0;if(vR===vP)badge='<span style="background:#f59e0b;color:#000;font-size:.6rem;padding:1px 5px;border-radius:10px;font-weight:700">+5</span>';}
        }

        const row=document.createElement("div");
        row.style.cssText="display:flex;align-items:center;gap:6px;padding:5px 8px;background:#060e06;border-radius:6px;margin-bottom:4px;font-size:.72rem";

        if(editando){
          // Inputs editáveis para o admin
          const mkI=(val,cb)=>{
            const inp=document.createElement("input");
            inp.type="number";inp.min="0";inp.max="20";
            inp.value=val!=null?val:"";
            inp.style.cssText="width:38px;text-align:center;font-size:.85rem;font-weight:700;background:#0d2a0d;border:1px solid #22c55e;border-radius:5px;color:#fff;padding:3px 0;outline:none";
            inp.addEventListener("input",e=>{
              const v=e.target.value===""?null:Math.max(0,Math.min(20,parseInt(e.target.value)||0));
              cb(v);
            });
            return inp;
          };
          const info=document.createElement("span");info.style.cssText="color:#444;min-width:30px";info.textContent=j.d;
          const tc=document.createElement("span");tc.style.cssText="flex:1;text-align:right;color:#999;font-size:.7rem";tc.textContent=j.c;
          const inpC=mkI(palJ?.c,v=>{if(!palEditavel.grupo)palEditavel.grupo={};if(!palEditavel.grupo[j.id])palEditavel.grupo[j.id]={};palEditavel.grupo[j.id].c=v;});
          const sep=document.createElement("span");sep.style.cssText="color:#22c55e;font-weight:900";sep.textContent="×";
          const inpF=mkI(palJ?.f,v=>{if(!palEditavel.grupo)palEditavel.grupo={};if(!palEditavel.grupo[j.id])palEditavel.grupo[j.id]={};palEditavel.grupo[j.id].f=v;});
          const tf=document.createElement("span");tf.style.cssText="flex:1;color:#999;font-size:.7rem";tf.textContent=j.f;
          const resSpan=document.createElement("span");resSpan.style.cssText="color:#FFD700;font-size:.65rem";resSpan.textContent=resJ?`${resJ.c}×${resJ.f}`:"";
          row.appendChild(info);row.appendChild(tc);row.appendChild(inpC);row.appendChild(sep);row.appendChild(inpF);row.appendChild(tf);row.appendChild(resSpan);
          if(badge){const b=document.createElement("span");b.innerHTML=badge;row.appendChild(b);}
        } else {
          row.innerHTML=`<span style="color:#444;min-width:30px">${j.d}</span><span style="flex:1;text-align:right;color:#999">${j.c}</span><span style="background:#0d1a0d;border:1px solid #1a3a1a;border-radius:5px;padding:2px 8px;font-weight:700;color:${palJ&&palJ.c!=null?"#fff":"#333"}">${palJ&&palJ.c!=null?`${palJ.c} × ${palJ.f}`:"— × —"}</span><span style="flex:1;color:#999">${j.f}</span>${resJ?`<span style="color:#FFD700;font-size:.65rem">${resJ.c}×${resJ.f}</span>`:""}${badge}`;
        }
        box.appendChild(row);
      });
    });

    ov.appendChild(box);document.body.appendChild(ov);
  }
  montar();
}

// ── ADMIN ────────────────────────────────────────────
function renderAdmin(cont){
  cont.innerHTML=`<div style="font-weight:900;color:#FFD700;font-size:1.05rem;margin-bottom:16px">⚙️ Admin ${isAdmin?'<span style="color:#22c55e;font-size:.7rem">● ATIVO</span>':''}</div>`;
  if(!isAdmin){
    cont.innerHTML+=`<div style="max-width:300px"><div style="color:#86efac;font-size:.78rem;margin-bottom:8px">Senha:</div><div style="display:flex;gap:8px"><input id="iS" type="password" placeholder="Senha..." style="flex:1;padding:10px 12px;border-radius:8px;border:2px solid #1a3a1a;background:#061506;color:#fff;outline:none"/><button onclick="window._adm()" style="background:#22c55e;color:#000;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700">Entrar</button></div><div style="color:#2a4a2a;font-size:.7rem;margin-top:8px">Padrão: copa2026</div></div>`;
    document.getElementById("iS")?.addEventListener("keydown",e=>{if(e.key==="Enter")window._adm();});
  } else {
    const info=document.createElement("div");info.style.cssText="background:#061a06;border:1px solid #22c55e;border-radius:10px;padding:12px;margin-bottom:14px;color:#86efac;font-size:.8rem;line-height:1.6";
    info.innerHTML="✅ Use <strong>Grupos</strong> para lançar resultados.<br>Os palpites travam automaticamente 24h antes de cada jogo.";
    cont.appendChild(info);
    const bs=document.createElement("button");bs.style.cssText="background:#1a0a0a;color:#f87171;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700";bs.textContent="🔒 Sair do Admin";bs.onclick=()=>{isAdmin=false;renderApp();toast("Admin desativado.");};cont.appendChild(bs);
    const pd=document.createElement("div");pd.style.cssText="margin-top:14px;padding:12px;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:10px";
    pd.innerHTML=`<div style="color:#86efac;font-size:.75rem;font-weight:700;margin-bottom:8px">👥 PARTICIPANTES (${participantes.length})</div>`;
    participantes.forEach(p=>{
      const row=document.createElement("div");row.style.cssText="display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:5px;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:8px;cursor:pointer";
      row.innerHTML=`<div style="flex:1"><div style="font-size:.8rem;color:#86efac;font-weight:700">${p.nome}</div><div style="font-size:.65rem;color:#3a6a3a">${p.email}</div></div><div style="font-size:.72rem;color:#4a7a4a">Ver palpites ▶</div>`;
      row.onclick=()=>verPalpites(p,null);
      pd.appendChild(row);
    });
    cont.appendChild(pd);
  }
}

window._adm=()=>{
  const s=document.getElementById("iS")?.value;
  if(s==="copa2026"){isAdmin=true;renderApp();toast("Admin ativo ✅");}
  else toast("Senha incorreta!","#ef4444");
};

// ── BOOT ─────────────────────────────────────────────
async function boot(){
  const salvo=localStorage.getItem("bu");
  if(salvo){
    try{
      usuario=JSON.parse(salvo);
      const sh=await fbG("bolao","shared")||{};
      participantes=sh.participantes||[];resReais=sh.resultados||{};confReais=sh.confReais||{};elimJogos=sh.elimJogos||{};elimResG=sh.elimRes||{};
      const ps=await fbG("palpites",usuario.id);if(ps)pals=ps;
      tela="grupos";listenShared();
    }catch(e){usuario=null;tela="login";}
  }
  renderApp();
}
boot();
