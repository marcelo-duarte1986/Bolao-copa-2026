// ═══════════════════════════════════════
// CLASSIFICAÇÃO DO GRUPO — critérios oficiais FIFA 2026
// 1) Pts confronto direto  2) SG confronto direto  3) GF confronto direto
// 4) SG geral  5) GF geral  6) Fair play (não implementado — empate raro)
// 7) Ranking FIFA (não implementado — usado só em sorteio)
// ═══════════════════════════════════════
function calcStatsGrupo(grupo, resultados) {
  const times = GRUPOS[grupo];
  const stats = {};
  times.forEach(t => stats[t] = {t, pts:0, j:0, v:0, e:0, d:0, gf:0, gc:0, sg:0});
  JOGOS.filter(j => j.g === grupo).forEach(j => {
    const r = resultados[j.id];
    if (!r || r.c == null || r.f == null) return;
    const ca = stats[j.c], fo = stats[j.f];
    ca.j++; fo.j++;
    ca.gf += r.c; ca.gc += r.f;
    fo.gf += r.f; fo.gc += r.c;
    ca.sg = ca.gf - ca.gc; fo.sg = fo.gf - fo.gc;
    if (r.c > r.f)      { ca.pts+=3; ca.v++; fo.d++; }
    else if (r.c < r.f) { fo.pts+=3; fo.v++; ca.d++; }
    else                { ca.pts+=1; fo.pts+=1; ca.e++; fo.e++; }
  });
  return stats;
}

// Stats apenas nos confrontos diretos entre um subconjunto de times
function calcH2H(times, grupo, resultados) {
  const h = {};
  times.forEach(t => h[t] = {pts:0, sg:0, gf:0});
  JOGOS.filter(j => j.g === grupo && times.includes(j.c) && times.includes(j.f)).forEach(j => {
    const r = resultados[j.id];
    if (!r || r.c == null || r.f == null) return;
    h[j.c].gf += r.c; h[j.c].sg += r.c - r.f;
    h[j.f].gf += r.f; h[j.f].sg += r.f - r.c;
    if (r.c > r.f)      { h[j.c].pts+=3; }
    else if (r.c < r.f) { h[j.f].pts+=3; }
    else                { h[j.c].pts+=1; h[j.f].pts+=1; }
  });
  return h;
}

function calcClassificacao(grupo, resultados) {
  const statsMap = calcStatsGrupo(grupo, resultados);
  const arr = Object.values(statsMap);

  // Comparador completo com critérios FIFA 2026
  function cmp(a, b, subset) {
    if (b.pts !== a.pts) return b.pts - a.pts;
    // Critérios H2H (só faz sentido se tivermos subconjunto)
    if (subset && subset.length >= 2) {
      const h = calcH2H(subset.map(x=>x.t), grupo, resultados);
      const ha = h[a.t], hb = h[b.t];
      if (hb.pts !== ha.pts) return hb.pts - ha.pts;
      if (hb.sg  !== ha.sg)  return hb.sg  - ha.sg;
      if (hb.gf  !== ha.gf)  return hb.gf  - ha.gf;
    }
    // Critérios gerais
    if (b.sg !== a.sg) return b.sg - a.sg;
    if (b.gf !== a.gf) return b.gf - a.gf;
    return 0;
  }

  // Ordena com critérios H2H aplicados apenas entre times empatados em pts
  arr.sort((a, b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    // Agrupa times com mesmo pts para calcular H2H
    const grupo_pts = arr.filter(x => x.pts === a.pts);
    return cmp(a, b, grupo_pts);
  });

  return arr;
}

// Encontra os 8 melhores terceiros — critérios FIFA: Pts, SG, GF
function getMelhoresTerceiros(res) {
  const terceiros = [];
  Object.keys(GRUPOS).forEach(g => {
    const cl = calcClassificacao(g, res);
    if (cl[2] && cl[2].j > 0) terceiros.push({...cl[2], grupo:g});
  });
  return terceiros.sort((a,b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    if (b.sg  !== a.sg)  return b.sg  - a.sg;
    if (b.gf  !== a.gf)  return b.gf  - a.gf;
    return 0;
  });
}

  "CDEFGHJK": ["C","G","J","D","H","F","E","K"],
  "CDEFGHIL": ["C","G","E","D","H","F","L","I"],
  "CDEFGHIK": ["C","G","E","D","H","F","I","K"],
  "CDEFGHIJ": ["C","G","J","D","H","F","E","I"],
};

// Dado os 8 grupos classificados, retorna os adversários dos 3os para cada jogo
// Retorna mapa: {R2: "3X", R5: "3Y", ...} onde X,Y são os grupos dos 3os
function getAlocacaoTerceiros(grupos8Sorted) {
  const key = grupos8Sorted.join("");
  const row = FIFA_MATRIX[key];
  if (!row) return null;
  // row = [1A_vs, 1B_vs, 1D_vs, 1E_vs, 1G_vs, 1I_vs, 1K_vs, 1L_vs]
  // Jogos que envolvem 3º: R2(1E), R5(1I), R7(1A), R8(1L), R9(1D), R10(1G), R13(1B), R15(1K)
  return {
    R7:  row[0], // 1A vs 3[row[0]]
    R13: row[1], // 1B vs 3[row[1]]
    R9:  row[2], // 1D vs 3[row[2]]
    R2:  row[3], // 1E vs 3[row[3]]
    R10: row[4], // 1G vs 3[row[4]]
    R5:  row[5], // 1I vs 3[row[5]]
    R15: row[6], // 1K vs 3[row[6]]
    R8:  row[7], // 1L vs 3[row[7]]
  };
}

function resolverTodosSlots(res) {
  const melhores8 = getMelhoresTerceiros(res).slice(0,8);
  const grupos8 = melhores8.map(t => t.grupo).sort();
  const timesDe = {}; // grupo → time (3º colocado daquele grupo)
  melhores8.forEach(t => timesDe[t.grupo] = t.t);

  const alocacao = getAlocacaoTerceiros(grupos8);
  const resultado = {};

  CRUZAMENTOS_FIXOS.forEach(cr => {
    for (const slot of [cr.casa, cr.fora]) {
      if (!slot.startsWith("3")) {
        const pos = parseInt(slot[0])-1;
        const grupo = slot[1];
        const cl = calcClassificacao(grupo, res);
        resultado[`${cr.id}_${slot}`] = cl[pos]?.t || null;
      } else {
        // Usa a matriz para saber qual grupo 3º vai neste jogo
        if (alocacao && alocacao[cr.id]) {
          const grupoTerceiro = alocacao[cr.id];
          resultado[`${cr.id}_${slot}`] = timesDe[grupoTerceiro] || null;
        } else {
          // Matriz não encontrada: fallback com pool do slot
          const pools = slot.replace("3","").split("");
          const candidato = melhores8.find(t => pools.includes(t.grupo));
          resultado[`${cr.id}_${slot}`] = candidato?.t || null;
        }
      }
    }
  });

  return resultado;
}

function resolverSlot(slot, res, slotsResolvidos, crId) {
  if (slotsResolvidos) return slotsResolvidos[`${crId}_${slot}`] || null;
  if (slot.startsWith("3")) return null;
  const pos = parseInt(slot[0])-1;
  const grupo = slot[1];
  const cl = calcClassificacao(grupo, res);
  return cl[pos]?.t || null;
}

// PONTUAÇÃO
// ═══════════════════════════════════════
function calcPts(pal,res,cp,cr,ep,er) {
  let pts=0;
  Object.entries(res||{}).forEach(([id,r])=>{
    const p=(pal||{})[id]; if(!p||p.c==null||p.f==null)return;
    if(p.c===r.c&&p.f===r.f){pts+=10;return;}
    const vR=r.c>r.f?1:r.f>r.c?-1:0,vP=p.c>p.f?1:p.f>p.c?-1:0;
    if(vR===vP)pts+=5;
  });
  Object.entries(cr||{}).forEach(([fase,arr])=>{
    (arr||[]).forEach((c,i)=>{
      if(!c?.casa||!c?.fora)return;
      const x=(cp||{})[fase]||[],y=x[i];
      if(y?.casa===c.casa&&y?.fora===c.fora)pts+=2;
    });
  });
  Object.entries(er||{}).forEach(([id,r])=>{
    const p=(ep||{})[id]; if(!p||p.c==null||p.f==null)return;
    if(p.c===r.c&&p.f===r.f){pts+=10;return;}
    const vR=r.c>r.f?1:r.f>r.c?-1:0,vP=p.c>p.f?1:p.f>p.c?-1:0;
    if(vR===vP)pts+=5;
  });
  return pts;
}

function criarJogoEl(jogo,isElim){
  const pal=isElim?(pals.elim||{})[jogo.id]:(pals.grupo||{})[jogo.id];
  const res=isElim?(elimRes||{})[jogo.id]:(resultados||{})[jogo.id];
  const bloqueado=(!isAdmin&&!!res)||(!isAdmin&&palsTravados);
  const acertouPlacar=res&&pal&&pal.c===res.c&&pal.f===res.f;
  const acertouVenc=res&&pal&&!acertouPlacar&&(()=>{const vR=res.c>res.f?1:res.f>res.c?-1:0,vP=(pal.c||0)>(pal.f||0)?1:(pal.f||0)>(pal.c||0)?-1:0;return vR===vP;})();
  const pts=acertouPlacar?10:acertouVenc?5:0;
  const borda=acertouPlacar?"#22c55e":acertouVenc?"#f59e0b":"#1a3a1a";
  const el=document.createElement("div");
  el.style.cssText=`background:linear-gradient(135deg,#0a1a0a,#081208);border:1px solid ${borda};border-radius:12px;padding:10px 12px;margin-bottom:8px`;
  const info=document.createElement("div");
  info.style.cssText="font-size:.68rem;color:#444;margin-bottom:5px";

  const row=document.createElement("div");
  row.style.cssText="display:flex;align-items:center;gap:8px;flex-wrap:wrap";
  const tc=document.createElement("div");
  tc.style.cssText="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:80px";
  tc.innerHTML=`<span style="font-size:.78rem;color:#ccc">${jogo.c}</span><span style="font-size:1.1rem">${BF(jogo.c)}</span>`;
  row.appendChild(tc);
  const inp=document.createElement("div");
  inp.style.cssText="display:flex;align-items:center;gap:5px;background:#060e06;border-radius:8px;padding:4px 8px";
  const mkI=(val,cb)=>{const i=document.createElement("input");i.type="number";i.min="0";i.max="20";i.value=val!=null?val:"";i.style.cssText=`width:42px;text-align:center;font-size:1.1rem;font-weight:700;background:#0d1a0d;border:2px solid ${bloqueado?"#2d3d2d":"#22c55e"};border-radius:6px;color:${bloqueado?"#556655":"#fff"};padding:5px 0;outline:none`;i.disabled=bloqueado;i.addEventListener("input",e=>{const v=e.target.value===""?null:Math.max(0,Math.min(20,parseInt(e.target.value)||0));cb(v);});return i;};
  inp.appendChild(mkI(pal?.c,v=>{if(isElim){pals.elim=pals.elim||{};pals.elim[jogo.id]={...(pals.elim[jogo.id]||{}),c:v};}else{pals.grupo=pals.grupo||{};pals.grupo[jogo.id]={...(pals.grupo[jogo.id]||{}),c:v};}agendarSave();}));
  const sp=document.createElement("span");sp.style.cssText="color:#22c55e;font-weight:900";sp.textContent="×";inp.appendChild(sp);
  inp.appendChild(mkI(pal?.f,v=>{if(isElim){pals.elim=pals.elim||{};pals.elim[jogo.id]={...(pals.elim[jogo.id]||{}),f:v};}else{pals.grupo=pals.grupo||{};pals.grupo[jogo.id]={...(pals.grupo[jogo.id]||{}),f:v};}agendarSave();}));
  row.appendChild(inp);
  const tf=document.createElement("div");
  tf.style.cssText="flex:1;display:flex;align-items:center;gap:4px;min-width:80px";
  tf.innerHTML=`<span style="font-size:1.1rem">${BF(jogo.f)}</span><span style="font-size:.78rem;color:#ccc">${jogo.f}</span>`;

function abrirModal(jogo,isElim){

  ov.innerHTML=`<div style="background:#0a1a0a;border:2px solid #FFD700;border-radius:16px;padding:24px;width:100%;max-width:320px;text-align:center"><div style="font-size:.8rem;color:#FFD700;font-weight:700;margin-bottom:16px">RESULTADO OFICIAL</div><div style="font-size:.9rem;color:#ccc;margin-bottom:12px">${BF(jogo.c)} ${jogo.c} × ${jogo.f} ${BF(jogo.f)}</div><div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px"><input id="mC" type="number" min="0" max="20" value="${res.c}" style="width:60px;text-align:center;font-size:1.5rem;font-weight:900;background:#061506;border:2px solid #22c55e;border-radius:8px;color:#fff;padding:8px 0;outline:none"/><span style="color:#FFD700;font-size:1.5rem;font-weight:900">×</span><input id="mF" type="number" min="0" max="20" value="${res.f}" style="width:60px;text-align:center;font-size:1.5rem;font-weight:900;background:#061506;border:2px solid #22c55e;border-radius:8px;color:#fff;padding:8px 0;outline:none"/></div><div style="display:flex;gap:10px"><button id="mCan" style="flex:1;background:#1a0a0a;color:#f87171;border:none;border-radius:8px;padding:11px;cursor:pointer;font-weight:700">Cancelar</button><button id="mSav" style="flex:1;background:#22c55e;color:#000;border:none;border-radius:8px;padding:11px;cursor:pointer;font-weight:700">Salvar ✓</button></div></div>`;
  document.body.appendChild(ov);

function renderElim(cont){
  const abas=document.createElement("div");

  FASES.forEach(f=>{
    const b=document.createElement("button");

    b.onclick=()=>{faseAtiva=f;renderTela();};
    abas.appendChild(b);
  });
  cont.appendChild(abas);

  // Resultados mesclados (palpites + reais) para simular classificação e confrontos
  const rm = buildResMesclado();

  if(faseAtiva==="32avos"){
    const box=document.createElement("div");

    // Resolve todos os slots de uma vez para evitar times repetidos
    const slotsResolvidos = resolverTodosSlots(rm);

    CRUZAMENTOS_FIXOS.forEach(cr=>{
      const timeCasa=resolverSlot(cr.casa,rm,slotsResolvidos,cr.id);
      const timeFora=resolverSlot(cr.fora,rm,slotsResolvidos,cr.id);
      const jogoConfirmado=(elimJogos["32avos"]||[]).find(j=>j.id===cr.id);
      const res=jogoConfirmado?(elimRes[jogoConfirmado.id]||null):null;

      const row=document.createElement("div");
      row.style.cssText="display:flex;align-items:center;gap:8px;margin-bottom:8px;background:#0a1525;border-radius:8px;padding:8px 10px;flex-wrap:wrap";

      // Label do jogo
      const lbl=document.createElement("div");
      lbl.style.cssText="font-size:.65rem;color:#3a5a7a;min-width:28px";
      lbl.textContent=cr.label;
      row.appendChild(lbl);

      // Time casa
      const tc=document.createElement("div");
      tc.style.cssText="flex:1;text-align:right;font-size:.78rem";
      if(timeCasa) tc.innerHTML=`<span style="color:#ccc">${timeCasa}</span> ${BF(timeCasa)}`;
      else tc.innerHTML=`<span style="color:#3a5a7a;font-style:italic">${cr.casa}</span>`;
      row.appendChild(tc);

      // Palpite / placar
      if(jogoConfirmado){
        const jFake={...jogoConfirmado,c:jogoConfirmado.c,f:jogoConfirmado.f,d:cr.data,h:"",s:cr.sede};
        const pEl=criarJogoEl(jFake,true);
        pEl.style.flex="2";pEl.style.margin="0";pEl.style.borderRadius="6px";
        row.appendChild(pEl);
      } else {
        const mid=document.createElement("div");
        mid.style.cssText="flex:2;text-align:center;font-size:.8rem;color:#1e3a5f";
        mid.innerHTML=`<span style="display:block;font-size:.62rem;color:#3a5a7a">${cr.data} · ${cr.sede}</span>${timeCasa&&timeFora?`<span style="color:#3b82f6">vs</span>`:res?"":timeCasa||timeFora?"⏳ aguardando...":"🔒 a definir"}`;
        row.appendChild(mid);
      }

      // Time fora
      const tf=document.createElement("div");
      tf.style.cssText="flex:1;font-size:.78rem";
      if(timeFora) tf.innerHTML=`${BF(timeFora)} <span style="color:#ccc">${timeFora}</span>`;
      else tf.innerHTML=`<span style="color:#3a5a7a;font-style:italic">${cr.fora}</span>`;
      row.appendChild(tf);

      // Admin: confirmar jogo
      if(isAdmin&&timeCasa&&timeFora&&!jogoConfirmado){
        const btnC=document.createElement("button");
        btnC.style.cssText="background:#22c55e;color:#000;border:none;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.7rem;font-weight:700;white-space:nowrap";
        btnC.textContent="Confirmar";
        btnC.onclick=async()=>{
          const novos=[...(elimJogos["32avos"]||[]),{id:cr.id,c:timeCasa,f:timeFora,fase:"32avos"}];
          elimJogos["32avos"]=novos;
          await fbSet("bolao","shared",{elimJogos});

        };
        row.appendChild(btnC);
      }
      box.appendChild(row);
    });
    cont.appendChild(box);

    // Melhores terceiros colocados (simulado com palpites + reais)

    const x=document.createElement("span");x.style.cssText="color:#3b82f6;font-weight:900";x.textContent="×";row.appendChild(x);
    row.appendChild(mkSel(cpI.fora,"Time fora",v=>{if(!pals.conf)pals.conf={};if(!pals.conf[fase])pals.conf[fase]=[];pals.conf[fase][idx]={...(pals.conf[fase][idx]||{}),fora:v};agendarSave();}));
    if(acertou){const ok=document.createElement("span");ok.style.cssText="color:#22c55e;font-weight:900;font-size:.75rem";ok.textContent="+2✓";row.appendChild(ok);}
    if(isAdmin){
      const s2=document.createElement("span");s2.style.cssText="color:#FFD700;margin-left:4px;font-size:.7rem";s2.textContent="Real:";row.appendChild(s2);
      row.appendChild(mkSel(cr.casa,"Casa",async v=>{if(!confReais[fase])confReais[fase]=Array(FASES_N[fase]).fill(null).map((_,i)=>({i,casa:null,fora:null}));confReais[fase][idx]={...confReais[fase][idx],casa:v};await fbSet("bolao","shared",{confReais});},"#1a1500","#FFD700"));
      const x2=document.createElement("span");x2.style.cssText="color:#FFD700;font-weight:900";x2.textContent="×";row.appendChild(x2);
      row.appendChild(mkSel(cr.fora,"Fora",async v=>{if(!confReais[fase])confReais[fase]=Array(FASES_N[fase]).fill(null).map((_,i)=>({i,casa:null,fora:null}));confReais[fase][idx]={...confReais[fase][idx],fora:v};await fbSet("bolao","shared",{confReais});},"#1a1500","#FFD700"));
    }
    box1.appendChild(row);
  }
  if(isAdmin){
    const btnC=document.createElement("button");
    btnC.style.cssText="background:#22c55e;color:#000;border:none;border-radius:8px;padding:10px;width:100%;font-weight:700;cursor:pointer;margin-top:8px";
    btnC.textContent="✅ Confirmar confrontos → liberar placares";
    btnC.onclick=async()=>{
      const jogos=(confReais[fase]||[]).filter(c=>c?.casa&&c?.fora).map((c,i)=>({id:`${fase}_${i}`,c:c.casa,f:c.fora}));
      elimJogos[fase]=jogos;await fbSet("bolao","shared",{elimJogos});toast(`${jogos.length} jogos confirmados ✅`);renderTela();
    };
    box1.appendChild(btnC);
  }
  cont.appendChild(box1);

  const jogosF=elimJogos[fase]||[];
  if(jogosF.length>0){
    const box2=document.createElement("div");
    box2.style.cssText="background:#080f08;border:1px solid #1a3a1a;border-radius:12px;padding:14px";
    box2.innerHTML=`<div style="font-weight:800;color:#86efac;font-size:.78rem;margin-bottom:10px;letter-spacing:1px">ETAPA 2 — PALPITE OS PLACARES (+10 exato / +5 vencedor)</div>`;
    jogosF.forEach(j=>box2.appendChild(criarJogoEl({...j,d:"",h:"",s:FASES_L[fase]},true)));
    cont.appendChild(box2);
  }
}

// ═══════════════════════════════════════
// RANKING
// ═══════════════════════════════════════
function renderRanking(cont){
  const hd=document.createElement("div");
  hd.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px";
  hd.innerHTML=`<div style="font-weight:900;color:#FFD700;font-size:1.05rem">🏆 Ranking</div>`;
  const btnAt=document.createElement("button");btnAt.style.cssText="background:#1a3a1a;color:#86efac;border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.72rem;font-weight:700";btnAt.textContent="↺ Atualizar";btnAt.onclick=()=>carregarRanking(cont);
  hd.appendChild(btnAt);cont.appendChild(hd);
  const lista=document.createElement("div");lista.id="rankLista";cont.appendChild(lista);
  carregarRanking(cont);
}

async function carregarRanking(cont){
  const lista=document.getElementById("rankLista");
  if(!lista)return;
  lista.innerHTML=`<div style="text-align:center;color:#3a6a3a;padding:20px">Carregando...</div>`;
  const snap=await fbGet("bolao","shared");
  if(snap){participantes=snap.participantes||[];resultados=snap.resultados||{};confReais=snap.confReais||{};elimJogos=snap.elimJogos||{};elimRes=snap.elimRes||{};}
  const todos=[];
  for(const p of participantes){const pal=await fbGet("palpites",p.id)||{};const pts=calcPts(pal.grupo||{},resultados,pal.conf||{},confReais,pal.elim||{},elimRes);todos.push({...p,pts});}
  todos.sort((a,b)=>b.pts-a.pts);
  lista.innerHTML="";
  if(todos.length===0){lista.innerHTML=`<div style="color:#3a6a3a;text-align:center;padding:40px">Nenhum participante ainda.</div>`;return;}
  todos.forEach((p,i)=>{
    const isEu=p.id===usuario?.id;
    const el=document.createElement("div");
    el.style.cssText=`display:flex;align-items:center;gap:10px;background:${isEu?"linear-gradient(135deg,#0a1a0a,#061a06)":"#080d08"};border:2px solid ${i===0?"#FFD700":i===1?"#888":i===2?"#cd7f32":isEu?"#22c55e":"#1a3a1a"};border-radius:12px;padding:12px 14px;margin-bottom:8px`;
    el.innerHTML=`<span style="font-size:1.4rem;width:32px;text-align:center">${i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}º`}</span><div style="flex:1"><div style="font-weight:700">${p.nome} ${isEu?'<span style="color:#22c55e;font-size:.68rem">(você)</span>':''}</div><div style="font-size:.68rem;color:#3a6a3a">${p.email}</div></div><div style="font-weight:900;font-size:1.4rem;color:${i===0?"#FFD700":"#fff"}">${p.pts}<span style="font-size:.65rem;color:#3a6a3a;font-weight:400;margin-left:2px">pts</span></div>`;
    lista.appendChild(el);
  });
  const info=document.createElement("div");
  info.style.cssText="margin-top:14px;padding:10px 14px;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:10px;font-size:.72rem;color:#3a6a3a;line-height:1.9";
  info.innerHTML="🎯 Placar exato → <strong style='color:#FFD700'>10pts</strong> &nbsp;|&nbsp; ✅ Vencedor → <strong style='color:#FFD700'>5pts</strong> &nbsp;|&nbsp; 🗓️ Confronto elim. → <strong style='color:#FFD700'>2pts</strong>";
  lista.appendChild(info);
}

// ═══════════════════════════════════════
// ADMIN
// ═══════════════════════════════════════
function renderAdmin(cont){
  cont.innerHTML=`<div style="font-weight:900;color:#FFD700;font-size:1.05rem;margin-bottom:16px">⚙️ Admin ${isAdmin?'<span style="color:#22c55e;font-size:.7rem">● ATIVO</span>':''}</div>`;
  if(!isAdmin){
    cont.innerHTML+=`<div style="max-width:300px"><div style="color:#86efac;font-size:.78rem;margin-bottom:8px">Senha:</div><div style="display:flex;gap:8px"><input id="inSenha" type="password" placeholder="Senha..." style="flex:1;padding:10px 12px;border-radius:8px;border:2px solid #1a3a1a;background:#061506;color:#fff;outline:none"/><button onclick="window.tentarAdmin()" style="background:#22c55e;color:#000;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700">Entrar</button></div><div style="color:#2a4a2a;font-size:.7rem;margin-top:8px">Padrão: copa2026</div></div>`;
    document.getElementById("inSenha")?.addEventListener("keydown",e=>{if(e.key==="Enter")window.tentarAdmin();});
  } else {
    const info=document.createElement("div");
    info.style.cssText="background:#061a06;border:1px solid #22c55e;border-radius:10px;padding:12px;margin-bottom:14px;color:#86efac;font-size:.8rem;line-height:1.6";
    info.innerHTML="✅ Use <strong>Grupos</strong> para lançar resultados.<br>A classificação atualiza automaticamente.<br>Em <strong>Elim. → 32-avos</strong>, confirme cada jogo quando os times estiverem definidos.";
    cont.appendChild(info);
    const btnS=document.createElement("button");btnS.style.cssText="background:#1a0a0a;color:#f87171;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:700";btnS.textContent="🔒 Sair do Admin";btnS.onclick=()=>{isAdmin=false;renderTela();toast("Admin desativado.");};cont.appendChild(btnS);
    // Painel de participantes detalhado
    const partDiv=document.createElement("div");
    partDiv.style.cssText="margin-top:14px;padding:12px;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:10px";
    partDiv.innerHTML=`<div style="color:#86efac;font-size:.75rem;font-weight:700;margin-bottom:10px">👥 PARTICIPANTES (${participantes.length})</div>`;

    participantes.forEach(p => {
      const row = document.createElement("div");
      const travado = !!p.travado;
      row.style.cssText = `display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;background:${travado?"#061a06":"#0d0d0d"};border:1px solid ${travado?"#1a4a1a":"#1a1a1a"};border-radius:8px;cursor:pointer`;
      row.innerHTML = `
        <div style="flex:1">
          <div style="font-size:.8rem;color:${travado?"#86efac":"#888"};font-weight:700">${p.nome}</div>
          <div style="font-size:.65rem;color:#3a6a3a">${p.email}</div>
        </div>
        <div style="font-size:.7rem">${travado?'<span style="background:#166534;color:#86efac;padding:2px 6px;border-radius:4px;font-weight:700">🔒 Travado</span>':'<span style="background:#1a1a1a;color:#666;padding:2px 6px;border-radius:4px">⏳ Editando</span>'}</div>
        <div style="font-size:.7rem;color:#4a7a4a">▶</div>
      `;
      row.onclick = () => abrirPalpitesParticipante(p);
      partDiv.appendChild(row);
    });

    if(participantes.length === 0){
      partDiv.innerHTML += '<div style="color:#3a6a3a;font-size:.75rem">Nenhum participante ainda.</div>';
    }
    cont.appendChild(partDiv);
  }
}

window.tentarAdmin=function(){
  const s=document.getElementById("inSenha")?.value;
  if(s===SENHA_ADMIN){isAdmin=true;renderTela();toast("Admin ativo ✅");}
  else toast("Senha incorreta!","#ef4444");
};

// ═══════════════════════════════════════
// ADMIN: VER PALPITES DE PARTICIPANTE
// ═══════════════════════════════════════
async function abrirPalpitesParticipante(p){
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;overflow-y:auto;padding:20px";

  const box = document.createElement("div");
  box.style.cssText = "max-width:600px;margin:0 auto;background:#0a1a0a;border:1px solid #1a3a1a;border-radius:16px;padding:20px";

  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div>
        <div style="font-weight:900;color:#22c55e;font-size:1rem">${p.nome}</div>
        <div style="font-size:.7rem;color:#3a6a3a">${p.email} · ${p.travado?"🔒 Travado":"⏳ Em edição"}</div>
      </div>
      <button onclick="this.closest('[style*=fixed]').remove()" style="background:#1a0a0a;color:#f87171;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700">✕ Fechar</button>
    </div>
  `;

  const loading = document.createElement("div");
  loading.style.cssText = "text-align:center;color:#3a6a3a;padding:20px";
  loading.textContent = "Carregando palpites...";
  box.appendChild(loading);
  ov.appendChild(box);
  document.body.appendChild(ov);

  const palP = await fbGet("palpites", p.id) || {};
  const pts = calcPts(palP.grupo||{}, resultados, palP.conf||{}, confReais, palP.elim||{}, elimRes);

  loading.remove();

  // Pontuação total
  const ptDiv = document.createElement("div");
  ptDiv.style.cssText = "background:#061506;border:1px solid #22c55e;border-radius:10px;padding:12px;text-align:center;margin-bottom:14px";
  ptDiv.innerHTML = `<div style="font-size:.75rem;color:#3a6a3a">PONTUAÇÃO ATUAL</div><div style="font-size:2rem;font-weight:900;color:#22c55e">${pts}<span style="font-size:.8rem;color:#3a6a3a"> pts</span></div>`;
  box.appendChild(ptDiv);

  // Palpites por grupo
  Object.keys(GRUPOS).forEach(g => {
    const secTit = document.createElement("div");
    secTit.style.cssText = "font-size:.72rem;font-weight:800;color:#86efac;margin:12px 0 6px;letter-spacing:1px";
    secTit.textContent = `GRUPO ${g}`;
    box.appendChild(secTit);

    JOGOS.filter(j=>j.g===g).forEach(j => {
      const palJ = (palP.grupo||{})[j.id];
      const resJ = resultados[j.id];
      let badge = '';
      if(resJ && palJ && palJ.c!=null){
        if(palJ.c===resJ.c&&palJ.f===resJ.f) badge='<span style="background:#22c55e;color:#000;font-size:.6rem;padding:1px 5px;border-radius:10px;font-weight:700">+10</span>';
        else { const vR=resJ.c>resJ.f?1:resJ.f>resJ.c?-1:0,vP=palJ.c>palJ.f?1:palJ.f>palJ.c?-1:0; if(vR===vP) badge='<span style="background:#f59e0b;color:#000;font-size:.6rem;padding:1px 5px;border-radius:10px;font-weight:700">+5</span>'; }
      }

      const row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:6px;padding:5px 8px;background:#060e06;border-radius:6px;margin-bottom:4px;font-size:.72rem";
      row.innerHTML = `
        <span style="color:#444;min-width:30px">${j.d}</span>
        <span style="flex:1;text-align:right;color:#999">${j.c}</span>
        <span style="background:#0d1a0d;border:1px solid #1a3a1a;border-radius:5px;padding:2px 8px;font-weight:700;color:${palJ&&palJ.c!=null?"#fff":"#333"}">${palJ&&palJ.c!=null?`${palJ.c} × ${palJ.f}`:"— × —"}</span>
        <span style="flex:1;color:#999">${j.f}</span>
        ${resJ?`<span style="color:#FFD700;font-size:.65rem">${resJ.c}×${resJ.f}</span>`:""}
        ${badge}
      `;
      box.appendChild(row);
    });
  });
}

// ═══════════════════════════════════════
// BOOT
// ═══════════════════════════════════════
async function boot(){
  const salvo=localStorage.getItem("bolao_usuario");
  if(salvo){
    try{
      usuario=JSON.parse(salvo);
      const shared=await fbGet("bolao","shared")||{};
      participantes=shared.participantes||[];resultados=shared.resultados||{};confReais=shared.confReais||{};elimJogos=shared.elimJogos||{};elimRes=shared.elimRes||{};
      const pal=await fbGet("palpites",usuario.id);
      if(pal)pals=pal;
      telaAtual="grupos";listenShared();
    }catch(e){usuario=null;telaAtual="login";}
  }
  renderTela();
}
boot();
